<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Create a Nexora Marketplace account as a buyer or seller.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<title>Create Account — Nexora Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"></head><body>
<header class="site" data-chrome-header></header>
<main class="container section narrow">
  <div class="auth-card">
    <div class="auth-brand"><span class="logo-mark">⚡</span> Nexora Marketplace</div>
    <h1>Create Your Account</h1>
    <p class="muted">Join as a buyer to shop, or apply as a seller to open your store.</p>
    <div class="role-picker">
      <label class="role-option"><input type="radio" name="role" value="buyer" checked><span>🛍️ <b>Buyer</b><small>Shop hardware &amp; track orders</small></span></label>
      <label class="role-option"><input type="radio" name="role" value="seller"><span>🏪 <b>Seller</b><small>Open your own store</small></span></label>
    </div>
    <form data-register-form>
      <div class="field"><label>Full name</label><input name="full_name" placeholder="Your name" minlength="2" required></div>
      <div class="field"><label>Email</label><input type="email" name="email" placeholder="you@email.com" required></div>
      <div class="field" data-store-field hidden><label>Store name</label><input name="store_name" placeholder="e.g. TechVerse Lahore"></div>
      <div class="field"><label>Password</label><input type="password" name="password" minlength="6" placeholder="At least 6 characters" required></div>
      <div class="field"><label>Confirm password</label><input type="password" name="confirm_password" placeholder="Re-enter your password" required></div>
      <button class="btn block lg" type="submit">Create Account</button>
      <p data-register-msg class="mt"></p>
    </form>
    <div class="auth-switch mt">
      <p class="muted" style="margin:0 0 12px">Already have an account?</p>
      <a class="btn ghost block" href="/login.html">Login</a>
    </div>
  </div>
</main>
<footer class="site" data-chrome-footer></footer>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Log in to your Nexora Marketplace account.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<title>Log In — Nexora Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"></head><body>
<header class="site" data-chrome-header></header>
<main class="container section narrow">
  <div class="auth-card">
    <div class="auth-brand"><span class="logo-mark">⚡</span> Nexora Marketplace</div>
    <h1>Welcome Back</h1>
    <p class="muted">Log in to track orders, shop faster and manage your store.</p>
    <div class="demo-creds" style="background:#f6f7fb;border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px;margin:14px 0;font-size:13px;line-height:1.7">
      <strong style="display:block;margin-bottom:4px">Demo accounts</strong>
      <div><strong>Admin</strong> — admin@nexora.com / admin123</div>
      <div><strong>Seller</strong> — seller@nexora.com / seller123</div>
      <div><strong>Buyer</strong> — buyer@nexora.com / buyer123</div>
    </div>
    <form data-login-form>
      <div class="field"><label>Email</label><input type="email" name="email" placeholder="you@email.com" required autocomplete="email"></div>
      <div class="field"><label>Password</label><input type="password" name="password" placeholder="••••••••" required autocomplete="current-password"></div>
      <div class="row between aic"><label class="small" style="font-weight:400"><input type="checkbox" name="remember" style="width:auto"> Remember me</label><a class="small" href="/forgot-password.html">Forgot password?</a></div>
      <button class="btn block lg" type="submit">Log in</button>
      <p data-login-msg class="mt"></p>
    </form>
    <div class="auth-switch mt">
      <p class="muted" style="margin:0 0 12px">Don't have an account?</p>
      <a class="btn ghost block" href="/register.html">Create Account</a>
    </div>
  </div>
</main>
<footer class="site" data-chrome-footer></footer>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body></html>

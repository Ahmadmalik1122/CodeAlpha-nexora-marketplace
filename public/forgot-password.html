<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Reset your Nexora Marketplace password.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<title>Forgot Password — Nexora Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"></head><body>
<header class="site" data-chrome-header></header>
<main class="container section narrow">
  <div class="auth-card">
    <div class="auth-brand"><span class="logo-mark">⚡</span> Nexora Marketplace</div>
    <h1>Reset your password</h1>
    <p class="muted">Enter your email and we'll send you a link to reset your password.</p>
    <form data-forgot-form>
      <div class="field"><label>Email</label><input type="email" name="email" required placeholder="you@email.com"></div>
      <button class="btn block lg" type="submit">Send reset link</button>
      <p data-forgot-msg class="mt"></p>
    </form>
    <p class="small muted mt"><a href="/login.html">← Back to login</a></p>
  </div>
</main>
<footer class="site" data-chrome-footer></footer>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body></html>

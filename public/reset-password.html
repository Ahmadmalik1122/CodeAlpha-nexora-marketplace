<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Choose a new password for your Nexora Marketplace account.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<title>Set New Password — Nexora Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"></head><body>
<header class="site" data-chrome-header></header>
<main class="container section narrow">
  <div class="auth-card">
    <div class="auth-brand"><span class="logo-mark">⚡</span> Nexora Marketplace</div>
    <h1>Set a new password</h1>
    <form data-reset-form>
      <div class="field"><label>New password</label><input type="password" name="password" minlength="6" required placeholder="At least 6 characters"></div>
      <div class="field"><label>Confirm password</label><input type="password" name="confirm" minlength="6" required></div>
      <button class="btn block lg" type="submit">Update password</button>
      <p data-reset-msg class="mt"></p>
    </form>
  </div>
</main>
<footer class="site" data-chrome-footer></footer>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body></html>
